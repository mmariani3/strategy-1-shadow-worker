services:
  - type: web
    name: strategy-1-discovery-coordinator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-discovery.txt
    startCommand: uvicorn discovery_coordinator:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RULESET_VERSION
        value: v0.3
      - key: SUPABASE_URL
        value: https://zgegtiqsjotszaspcgzf.supabase.co
      - key: ORCHESTRATOR_URL
        value: https://strategy-1-shadow-orchestrator.onrender.com
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ORCHESTRATOR_TOKEN
        sync: false
      - key: DISCOVERY_SERVICE_TOKEN
        generateValue: true
      - key: SEC_USER_AGENT
        sync: false
